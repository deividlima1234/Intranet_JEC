services:
  postgres:
    image: postgres:16-alpine
    container_name: intranet_jec_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-intranet_jec}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intranet_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet_jec_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-intranet_jec}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - intranet_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intranet_jec_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - intranet_net

volumes:
  postgres_data:
  backend_uploads:

networks:
  intranet_net:
    driver: bridge
